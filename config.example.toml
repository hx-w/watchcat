# Copy to the path printed by `watchcat config path`, or run `watchcat config init`.
version = 4

[engine]
poll_interval_seconds = 10
attempt_window_seconds = 3600
log_retention = 10000

# A target is removed from Watchcat only. The provider session is never deleted.
[lifecycle]
stale_after_seconds = 259200

[providers.codex]
enabled = true
command = ["codex", "app-server", "--listen", "stdio://"]

[providers.claude]
enabled = true

# Prefer `watchcat config policy set` over editing policy tables by hand.
[policies."capacity.model_overloaded"]
action = "retry"
backoff = "exponential"
initial_delay_seconds = 15
max_delay_seconds = 300
max_attempts = 5
prompt = "The {model} model is overloaded. Continue the unfinished task. Attempt {attempt}/{max_attempts}."
