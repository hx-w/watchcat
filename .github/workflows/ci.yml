name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --all-targets --locked

  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check shell installer
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/install.sh
          bash -n scripts/install.sh
          scripts/install.sh --version v0.1.0 --dry-run

  package:
    name: Package crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo package --locked

  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --all-targets --locked
