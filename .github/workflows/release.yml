name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag and test
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${crate_version}" = "${RELEASE_TAG}"
          cargo test --all-targets --locked

  build:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: rustup default stable
      - run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Package Unix binary
        shell: bash
        run: |
          set -euo pipefail
          staging="watchcat-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/watchcat" "$staging/"
          cp "target/${{ matrix.target }}/release/watchcatd" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
      - uses: actions/upload-artifact@v7
        with:
          name: watchcat-${{ matrix.target }}
          path: watchcat-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  smoke-artifacts:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release payload before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 4
          for archive in artifacts/watchcat-*.tar.gz; do
            archive_entries="$(tar -tzf "$archive")"
            grep -Eq '/watchcat$' <<<"$archive_entries"
            grep -Eq '/watchcatd$' <<<"$archive_entries"
          done

  installers:
    needs: [build, smoke-artifacts]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Start local release server
        shell: bash
        run: |
          python3 -m http.server 8765 --directory release-files >"${RUNNER_TEMP}/watchcat-http.log" 2>&1 &
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - name: Smoke test shell installer
        shell: bash
        env:
          WATCHCAT_RELEASE_BASE_URL: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          cd release-files
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum watchcat-* > SHA256SUMS
          else
            shasum -a 256 watchcat-* > SHA256SUMS
          fi
          cd ..
          destination="${RUNNER_TEMP}/watchcat-bin"
          bash scripts/install.sh --version "${RELEASE_TAG}" --to "$destination"
          test "$("${destination}/watchcat" --version)" = "watchcat ${RELEASE_TAG#v}"
          test "$("${destination}/watchcatd" --version)" = "watchcatd ${RELEASE_TAG#v}"

  publish:
    needs: [build, smoke-artifacts, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}"
          artifacts/*
          --verify-tag
          --notes-file docs/release-notes.md
          --title "Watchcat ${RELEASE_TAG}"
