name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag and test
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
          cargo test --all-targets --locked

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="watchcat-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/watchcat" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "watchcat-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/watchcat.exe" $staging
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: watchcat-${{ matrix.target }}
          path: watchcat-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: cd artifacts && sha256sum watchcat-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*
          --verify-tag
          --generate-notes
          --title "Watchcat ${GITHUB_REF_NAME}"

  installers:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/watchcat-bin"
          bash scripts/install.sh --version "${GITHUB_REF_NAME}" --to "$destination"
          test "$("${destination}/watchcat" --version)" = "watchcat ${GITHUB_REF_NAME#v}"
      - name: Smoke test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "watchcat-bin"
          ./scripts/install.ps1 -Version $env:GITHUB_REF_NAME -InstallDir $destination
          $actual = & (Join-Path $destination "watchcat.exe") --version
          $expected = "watchcat " + $env:GITHUB_REF_NAME.Substring(1)
          if ($actual -ne $expected) { throw "Expected '$expected', got '$actual'" }
