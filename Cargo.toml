[package]
name = "watchcat"
version = "0.6.0"
default-run = "watchcat"
edition = "2024"
rust-version = "1.85"
description = "A provider-neutral watchdog that safely resumes interrupted AI coding sessions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hx-w/watchcat"
homepage = "https://github.com/hx-w/watchcat"
documentation = "https://docs.rs/watchcat"
keywords = ["codex", "agent", "watchdog", "automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXError", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString", "CFNumber", "CFRunLoop", "CFDate", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSNotification", "NSOperation", "NSString", "NSURL", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
